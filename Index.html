<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Form</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: inline-block;
      margin-bottom: 5px;
    }
    input[type="text"],
    input[type="email"],
    input[type="password"] {
      width: 100%;
      max-width: 300px;
      padding: 8px;
      box-sizing: border-box;
    }
    .radio-group {
      margin-top: 5px;
    }
    button {
      padding: 10px 20px;
      cursor: pointer;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <h4>FORM</h4>
  <form id="registrationForm">
    
    <div class="form-group">
      <input type="text" id="fullName" placeholder="Enter Name">
    </div>

    <div class="form-group">
      <input type="email" id="email" placeholder="Email ID">
    </div>

    <div class="form-group">
      <input type="password" id="password" placeholder="Password">
    </div>

    <h5>OPTIONAL SUBJECT</h5>
    
    <div class="radio-group">
      <input type="radio" id="punjabi" name="subject" value="Punjabi">
      <label for="punjabi">Punjabi</label>
    </div>

    <div class="radio-group">
      <input type="radio" id="sanskrit" name="subject" value="Sanskrit">
      <label for="sanskrit">Sanskrit</label>
    </div>

    <br>
    <button type="submit">Submit</button>
  </form>

  <!-- JavaScript in the same file to guarantee execution on Mobile Apps -->
  <script>
    const form = document.getElementById('registrationForm');

    form.addEventListener('submit', function(event) {
      event.preventDefault(); // Page refresh hone se rokta hai

      const nameInput = document.getElementById('fullName').value.trim();
      const emailInput = document.getElementById('email').value.trim();
      const passwordInput = document.getElementById('password').value.trim();
      const selectedSubject = document.querySelector('input[name="subject"]:checked');

      const formData = {
        name: nameInput || "Not provided",
        email: emailInput || "Not provided",
        password: passwordInput || "Not provided",
        subject: selectedSubject ? selectedSubject.value : "Not selected"
      };

      // 1. Console me log karega
      console.log('Submitted Data:', formData);

      // 2. Alert pop-up bhi dikhayega (Mobile pe easy testing ke liye)
      alert(
        "Form Submitted!\n\n" +
        "Name: " + formData.name + "\n" +
        "Email: " + formData.email + "\n" +
        "Password: " + formData.password + "\n" +
        "Subject: " + formData.subject
      );

      form.reset();
    });
  </script>
</body>
</html>
